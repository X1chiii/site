<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Просто так</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600&display=swap">
<style>
:root{
  --bg:#fbeee9; --glow1:#ffb9a3; --glow2:#d2bcff; --ink:#3a1f3d; --soft:#7a5a7d;
  --card:rgba(255,255,255,.55); --line:rgba(58,31,61,.15); --accent:#c2456b; --btn-ink:#fff;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1530; --glow1:#ff8f7a; --glow2:#6f52ff; --ink:#fbe6dc; --soft:#b9a7d6;
    --card:rgba(255,255,255,.07); --line:rgba(251,230,220,.18); --accent:#ff9db5; --btn-ink:#1b1530;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1530; --glow1:#ff8f7a; --glow2:#6f52ff; --ink:#fbe6dc; --soft:#b9a7d6;
  --card:rgba(255,255,255,.07); --line:rgba(251,230,220,.18); --accent:#ff9db5; --btn-ink:#1b1530;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  overflow:hidden; position:relative;
}
/* плавающий градиент на фоне */
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow span{position:absolute;border-radius:50%;filter:blur(48px);opacity:.6;will-change:transform}
.glow .a{width:70vmax;height:70vmax;left:-20vmax;top:-18vmax;background:radial-gradient(circle,var(--glow1),transparent 68%);animation:fa 16s ease-in-out infinite alternate}
.glow .b{width:75vmax;height:75vmax;right:-28vmax;bottom:-26vmax;background:radial-gradient(circle,var(--glow2),transparent 68%);animation:fb 21s ease-in-out infinite alternate}
.glow .c{width:50vmax;height:50vmax;left:25vw;top:35vh;background:radial-gradient(circle,var(--glow1),transparent 70%);opacity:.35;animation:fc 26s ease-in-out infinite alternate}
@keyframes fa{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(22vw,14vh,0) scale(1.15)}100%{transform:translate3d(10vw,30vh,0) scale(.95)}}
@keyframes fb{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-24vw,-12vh,0) scale(1.1)}100%{transform:translate3d(-8vw,-30vh,0) scale(1.2)}}
@keyframes fc{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-20vw,18vh,0) scale(1.25)}100%{transform:translate3d(18vw,-16vh,0) scale(.9)}}
main{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.screen{display:none;width:100%;max-width:440px;text-align:center;flex-direction:column;align-items:center}
.screen.on{display:flex;animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.screen.on h1{animation:title 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes title{from{letter-spacing:.12em;opacity:0}to{letter-spacing:-.01em;opacity:1}}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(3.4rem,18vw,5.6rem);line-height:.95;margin:0 0 20px;letter-spacing:-.01em}
.lead{font-size:1.05rem;line-height:1.6;color:var(--soft);margin:0 0 36px;max-width:30ch}
.btn{font:600 1rem var(--sans);background:var(--accent);color:var(--btn-ink);border:0;border-radius:999px;padding:16px 34px;min-height:52px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.stage{width:100%;min-height:min(58vh,380px);background:var(--card);border:1px solid var(--line);border-radius:28px;
  padding:36px 26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:inherit;font:inherit;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stage{transition:transform .25s}
.stage:active{transform:scale(.985)}
.stage p{font-family:var(--serif);font-weight:500;font-size:clamp(1.65rem,7.4vw,2.2rem);line-height:1.25;margin:0;transition:opacity .35s ease,transform .35s ease,filter .35s ease}
.stage p.out{opacity:0;transform:translateX(-32px);filter:blur(6px)}
.stage p.in{opacity:0;transform:translateX(32px);filter:blur(6px);transition:none}
.hint{font-size:.9rem;color:var(--soft);margin:18px 0 0;min-height:1.4em}
.dots{display:flex;gap:8px;margin-top:22px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.on{background:var(--accent);transform:scale(1.35)}
.heart{width:56px;height:56px;margin-bottom:22px;fill:var(--accent);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.end p{font-family:var(--serif);font-size:clamp(1.5rem,6.6vw,2rem);line-height:1.3;margin:0 0 32px}
@media (prefers-reduced-motion:reduce){.glow span,.heart,.screen.on,.screen.on h1{animation:none}.stage p{transition:none}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>
<main>
  <section class="screen on" id="intro">
    <h1>Паприколу</h1>
    <p class="lead">Мне было скучно просто заниматься обществом так что вот результат моей скукоты</p>
    <button class="btn" id="open">Открыть</button>
  </section>

  <section class="screen" id="cards">
    <button class="stage" id="stage" aria-live="polite"><p id="text"></p></button>
    <p class="hint" id="hint">Нажми на карточку чтобы читать дальше</p>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </section>

  <section class="screen end" id="end">
    <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.9 5 6.4 5c2 0 3.6 1.1 4.4 2.6h.4C12 6.1 13.600 5 15.600 5c3.500 0 5.400 3.600 4 6.800C19.500 16.400 12 21 12 21z"/></svg>
    <p>Пупупу вот так вот да</p>
    <button class="btn ghost" id="again">Еще раз</button>
  </section>
</main>

<script>
// Меняй тексты здесь — по одному комплименту на карточку
const MESSAGES = [
  "Вера ты самый хороший человек которого я встречал",
  "У тебя красивый голос, так и хочется слушать тебя весь день",
  "Твой юмор для меня останется навсегда самым лучшим",
  "Мне нравится твой смех смейся почаще пж",
  "Ты намного больше похожа на кошкодевочку чем думаешь",
  "Дурачка мая спасибо что общаешься со мной"
];

const $ = id => document.getElementById(id);
const screens = {intro:$("intro"), cards:$("cards"), end:$("end")};
const text = $("text"), dots = $("dots"), hint = $("hint");
let i = 0, busy = false;

MESSAGES.forEach(() => dots.appendChild(document.createElement("i")));

function show(name){
  Object.values(screens).forEach(s => s.classList.remove("on"));
  screens[name].classList.add("on");
}
function paint(){
  text.textContent = MESSAGES[i];
  [...dots.children].forEach((d,k) => d.classList.toggle("on", k === i));
  hint.textContent = i === MESSAGES.length - 1 ? "Это последняя" : "Нажми на карточку, чтобы читать дальше";
}
function next(){
  if (busy) return;
  if (i >= MESSAGES.length - 1){ show("end"); return; }
  busy = true;
  text.classList.add("out");
  setTimeout(() => { i++; paint(); text.classList.remove("out"); text.classList.add("in"); void text.offsetWidth; text.classList.remove("in"); setTimeout(() => { busy = false; }, 350); }, 320);
}

$("open").onclick = () => { i = 0; paint(); show("cards"); };
$("stage").onclick = next;
$("again").onclick = () => { i = 0; paint(); show("cards"); };
</script>
</body>
</html>
